name: ETH Signal Engine

on:
  schedule:
    # Every 5 minutes, 07:00-16:00 UTC (London), Mon-Fri
    - cron: '*/5 7-15 * * 1-5'
  workflow_dispatch:  # manual trigger for testing

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install TA-Lib
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
        cd ..

    - name: Install Python packages
      run: |
        pip install TA-Lib==0.4.31 pandas numpy requests

    - name: Run signal engine
      env:
        BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
        BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        RISK_USDT: ${{ vars.RISK_USDT || '10' }}
        MAX_NOTIONAL: ${{ vars.MAX_NOTIONAL || '100' }}
      run: python github_signal/signal_engine.py

    - name: Commit state + journal
      run: |
        git config user.name "signal-bot"
        git config user.email "signal-bot@users.noreply.github.com"
        git add state.json journal.csv
        git diff --cached --quiet || git commit -m "update $(date -u +%Y-%m-%dT%H:%M)"
        git push
